services:
  postgres:
    image: postgres:16-alpine
    container_name: homecare-postgres
    environment:
      POSTGRES_USER: homecare
      POSTGRES_PASSWORD: homecare123
      POSTGRES_DB: homecare_pro
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecare"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
